    <script>
      // Подсветка раздела
      document.addEventListener("DOMContentLoaded", function () {
        const targetHref = "main.html";

        const links = document.querySelectorAll(".ecosys a");
        links.forEach((link) => {
          if (link.getAttribute("href") === targetHref) {
            link.classList.add("active");
          }
        });

        // Скрытие избранного и поиска
        const liked = document.querySelector(".liked");
        const searchInput = document.getElementById("searchInput");

        if (liked) {
          liked.classList.add("hidden");
        }
        if (searchInput) {
          searchInput.classList.add("hidden");
        }
      });
    </script>

        <h1>Важно знать</h1>
        <p>На текущий момент имеется 3 уровня подписки, которые открывают доступ к записям за соответствующие годы:<br />ЯГодень Стартовый – 2022-2023 год.<br />ЯГодень Стандарт – 2022-2025 год.<br />ЯГодень Премиум – 2022-2026 год.</p>
        <p>При этом записи за 2020 и 2021 годы, а также некоторые популярные аниме, доступны для просмотра без подписки.</p>
        <p>Если для просмотра какой-либо тайтл требует один из уровней подписки, то это указывается на карточке тайтла с использованием цветной обводки, а также внутри всплывающего окна с сериями этого же тайтла.</p>
        <p>Для просмотра любых записей необходимо вступить в группу ВК:</p>
        <a href="https://vk.com/invite/A8Zbmwc"><h1>Производственные склады Годнестана</h1></a>
        <p>Стоит обратить внимание, что для тайтлов указывается минимальный уровень подписки, который может потребоваться для просмотра – часть серий может быть общедоступна, а часть требовать какой-либо уровень, например, если разные сезоны тайтла были просмотрены в разные года.</p>
        <a href="https://vk.com/archive_aslan?w=donut_payment-208448461"><h1>Оформить подписку ВК Донат</h1></a>

        <p>Инструкция:<br />1. Зарегистрироваться на <a href="https://yoomoney.ru/">ЮMoney</a>. <br />2. Создать бесплатную <a href="https://yoomoney.ru/cards/virtual">виртуальную карту МИР</a>. <br />3. Оплатить подписку ВК Донат <a href="https://promo.yoomoney.ru/howtouseit">следуя инструкциям</a>.</p>

    <template id="About-Orders">
      <button class="popup-exit"></button>
      <div class="custom-content">
        <p>Список заказов расположен в той последовательности, в которой были заказаны слоты к тайтлу, по дате от старых к новым.<br />При этом если заказать контент, который ранее уже начали смотреть, он будет считаться как актуальный заказ и просмотр продолжится в ближайшее время (окончательное решение за стримером).</p>
        <h1>Сколько это стоит?</h1>
        <p>С 01.01.2025 заказ 1 слота стоит 2000 российских рублей. 1 слот равен 2 часам экранного времени на стриме.</p>
        <h1>Как это работает?</h1>
        <p>За донат арендуется экранное время на стриме, на которое можно выбрать почти любой вид контента.<br />В среднем 1 слот это либо 4 серии аниме, либо 2 серии сериала, либо 1 фильм.</p>
        <a href="https://www.donationalerts.com/r/godenname"><h1>Заказать контент на стрим</h1></a>
        <h1>Правила округления</h1>
        <p>Серия длительностью до 30 минут = 0.25 слота<br />Серия длительностью 31~60 минут = 0.5 слота</p>
        <p>Полнометражный контент до 60 минут = 0.5 слота<br />Полнометражный контент 61~120 минут = 1 слот<br />Полнометражный контент дольше 120 минут = 1 слот + 0.5 слота за каждые дополнительные 60 минут.</p>
        <p>Манга, книги и игры 1-60 минут = 0.5 слота<br />Манга, книги и игры 61-120 минут = 1 слот<br />Манга, книги и игры дольше 120 минут = 1 слот + 0.5 слота за каждые дополнительные 60 минут.</p>
        <p>Если в тайтле длительность каждой серии разная, то считается суммарная длительность серий.<br />При необходимости свои слоты можно свапать местами по дате с любыми заказами, а также менять заказы (заранее оповестив стримера).</p>
        <h1>Правила продвижения</h1>
        <p>Также существует система мгновенного продвижения контента «Четыре топора».</p>
        <p>За донат в размере 7777 российских рублей даётся возможность сократить время в очереди до нуля, и таким образом ускорить появление контента на ближайших стримах.<br />Система «Четыре топора» позволяет продвинуть до 4х слотов, которые можно поставить сразу все в один день, устроив мини-марафон, либо размазать их по неделе. Продвигать можно как свои заказы, так и чужие.</p>
        <p>При продвижении выбрать можно любую дату, даже текущий день. Если на желаемой дате уже стоят заказы, то они будут перенесены. В том числе можно бронировать следующую неделю и позднее.</p>
        <p>Внимание! Это не заказ контента, это продвижение! Контент для просмотра на стриме необходимо заказывать отдельно.<br />Рекомендуется заранее предупредить Годня о продвижении чтобы он смог подготовиться и заблаговременно скачать нужные к стриму заказы.</p>
        <h1>Заказ видео на покер (Временно недоступно)</h1>
        <p>Заказать просмотр видео можно с любой длительностью, но желательно не дольше часа:<br />До 5 минут = 150 рублей<br />5-10 минут = 200 рублей<br />11-20 минут = 400 рублей<br />21-40 минут = 700 рублей<br />41-60 минут = 1000 рублей</p>
        <p>Если видео заказано на текущем стриме по покеру, то оно будет просмотрено на следующем стриме или позже.</p>
        <a href="https://www.donationalerts.com/r/godenname"><h1>Заказать контент на стрим</h1></a>
      </div>
    </template>
