name: Purge jsDelivr Cache

on:
  push:
    branches:
      - main

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge jsDelivr Cache
        run: |
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/style.css
