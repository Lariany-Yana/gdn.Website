          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/JS/core.js
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/JS/main-module.js
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/JS/orders-module.js
          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/JS/titles-module.js

          curl -s https://purge.jsdelivr.net/gh/${{ github.repository }}@${{ github.ref_name }}/BD1/Amusement/Events.js
