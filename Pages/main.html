    <!-- Шаблон: О подписке -->
    <template id="page-Donut">
      <div class="page">
        <h1>Важно знать</h1>
        <p>На текущий момент имеется 3 уровня подписки, которые открывают доступ к записям за соответствующие годы:<br />ЯГодень Стартовый – 2022-2023 год.<br />ЯГодень Стандарт – 2022-2025 год.<br />ЯГодень Премиум – 2022-2026 год.</p>
        <p>При этом записи за 2020 и 2021 годы, а также некоторые популярные аниме, доступны для просмотра без подписки.</p>
        <p>Если для просмотра какой-либо тайтл требует один из уровней подписки, то это указывается на карточке тайтла, а также внутри всплывающего окна с сериями этого же тайтла.</p>
        <p>Для просмотра любых записей необходимо вступить в группу ВК: <a href="https://vk.com/invite/A8Zbmwc">Производственные склады Годнестана</a></p>
        <p>Стоит обратить внимание, что для тайтлов указывается минимальный уровень подписки, который может потребоваться для просмотра – часть серий может быть общедоступна, а часть требовать какой-либо уровень, например, если разные сезоны тайтла были просмотрены в разные года.</p>
        <h1>Для зрителей не из РФ</h1>
        <p>ВК Донат принимает платежи только с российских банковских карт, из ВК Пей и через СБП.<br />Если у вас нет возможности оформить подписку перечисленными вариантами, то Вы можете создать виртуальную карту системы МИР от ЮMoney и использовать её для оплаты. Обратите внимание, что это будет карта банка РФ.</p>
        <p>Инструкция:<br />1. Зарегистрироваться на <a href="https://yoomoney.ru/">ЮMoney</a>. <br />2. Создать бесплатную <a href="https://yoomoney.ru/cards/virtual">виртуальную карту МИР</a>. <br />3. Оплатить подписку ВК Донат <a href="https://promo.yoomoney.ru/howtouseit">следуя инструкциям</a>.</p>
      </div>
    </template>
    <!-- Шаблон: Правила заказа -->
    <template id="page-Rules">
      <div class="page">
        <h1>Важно знать</h1>
        <p>Список заказов расположен в той последовательности, в которой были заказаны слоты к тайтлу, по дате от старых к новым.<br />При этом если заказать контент, который ранее уже начали смотреть, он будет считаться как актуальный заказ и просмотр продолжится в ближайшее время (окончательное решение за стримером).</p>
        <h1>Сколько это стоит?</h1>
        <p>С 01.01.2025 заказ 1 слота стоит 2000 российских рублей. 1 слот равен 2 часам экранного времени на стриме.</p>
        <h1>Как это работает?</h1>
        <p>За донат арендуется экранное время на стриме, на которое можно выбрать почти любой вид контента.<br />В среднем 1 слот это либо 4 серии аниме, либо 2 серии сериала, либо 1 фильм.</p>
        <h1>Правила округления</h1>
        <p>Серия длительностью до 30 минут = 0.25 слота<br />Серия длительностью 31~60 минут = 0.5 слота</p>
        <p>Полнометражный контент до 60 минут = 0.5 слота<br />Полнометражный контент 61~120 минут = 1 слот<br />Полнометражный контент дольше 120 минут = 1 слот + 0.5 слота за каждые дополнительные 60 минут.</p>
        <p>Манга, книги и игры 1-60 минут = 0.5 слота<br />Манга, книги и игры 61-120 минут = 1 слот<br />Манга, книги и игры дольше 120 минут = 1 слот + 0.5 слота за каждые дополнительные 60 минут.</p>
        <p>Если в тайтле длительность каждой серии разная, то считается суммарная длительность серий.<br />При необходимости свои слоты можно свапать местами по дате с любыми заказами, а также менять заказы (заранее оповестив стримера).</p>
        <h1>Правила продвижения</h1>
        <p>Также существует система мгновенного продвижения контента «Четыре топора».</p>
        <p>За донат в размере 7777 российских рублей даётся возможность сократить время в очереди до нуля, и таким образом ускорить появление контента на ближайших стримах.<br />Система «Четыре топора» позволяет продвинуть до 4х слотов, которые можно поставить сразу все в один день, устроив мини-марафон, либо размазать их по неделе. Продвигать можно как свои заказы, так и чужие.</p>
        <p>При продвижении выбрать можно любую дату, даже текущий день. Если на желаемой дате уже стоят заказы, то они будут перенесены. В том числе можно бронировать следующую неделю и позднее.</p>
        <p>Внимание! Это не заказ контента, это продвижение! Контент для просмотра на стриме необходимо заказывать отдельно.<br />Рекомендуется заранее предупредить Годня о продвижении чтобы он смог подготовиться и заблаговременно скачать нужные к стриму заказы.</p>
        <h1>Заказ видео на покер</h1>
        <p>Заказать просмотр видео можно с любой длительностью, но желательно не дольше часа:<br />До 5 минут = 150 рублей<br />5-10 минут = 200 рублей<br />11-20 минут = 400 рублей<br />21-40 минут = 700 рублей<br />41-60 минут = 1000 рублей</p>
        <p>Если видео заказано на текущем стриме по покеру, то оно будет просмотрено на следующем стриме или позже.</p>
      </div>
    </template>

        <p>Если Вы являетесь владельцем авторских прав для какого-либо контента на сайте, обратите внимание, что все плееры встроены из сторонних API источников. Для удаления контента, который нарушает Ваши авторские права, пожалуйста, свяжитесь с нами через личные сообщения в группе ВК <a href="https://vk.com/invite/A8Zbmwc">Производственные склады Годнестана</a>.</p>
      </div>

    <template id="page-Updates">
      <div class="page">
        <h1>Что нового от 21.09.26</h1>
        <p>Новая QoL-функция:<br />Теперь для последнего открытого (по ссылке или в плеере) эпизода тайтла добавляется иконка, которая помогает отслеживать в каком месте сезона Вы остановились. Чтобы вручную убрать иконку достаточно кликнуть по ней.</p>
        <h1>Что нового от 09.09.26</h1>
        <p>Переработка дизайна:<br />Сайт сохранил прежние функции, но был стилистически изменён, а именно:<br />Формат. Теперь сайт выглядит как компактное "окно" (в десктопной версии) без излишней дизайнерской вычурности.<br />Карточки. Почти не претерпели изменений.<br />Окно эпизодов. Теперь формат эпизодов это не просто кнопка-ссылка, а мини-карточка этого эпизода, которая имеет в себе относительно полезную информацию (Дату стрима и Уровень подписки для записи), а также кнопку-ссылку и кнопку-плеер для просмотра записи. Помимо этого отдельные сезоны с эпизодами можно сворачивать для удобства (по-умолчанию все развёрнуты).</p>
        <p>Упразднение функции – «Настройки»<br />Окно настроек было убрано, теперь возможные настройки сайта (Формат окна и Выбор темы) находятся непосредственно на "окне" сайта.</p>
        <p>Упразднение функции – Плеер<br />Больше не требуется выбирать что именно пользователь будет использовать на сайте - ссылку или плеер, теперь оба варианта доступны сразу - как на карточке тайтла, так и на карточке эпизода.</p>
        <p>Убрана вкладка – Главная<br />Вкладка «Главная» со стеной почёта и позора на Главной странице была убрана для переработки.</p>
        <h1>Что нового от 30.07.26</h1>
        <p>Упразднение функции в окне «Настройки»<br />Функция выбора домена ВК была удалена так как ВК теперь всегда перенаправляет на новый домен.</p>
        <h1>Что нового от 05.07.26</h1>
        <p>Новая функция в разделе «Тайтлы» – Плеер<br />Для сайта добавлена функция просмотра контента в плеере прямо на сайте не переходя по ссылкам (где возможно). При желании возможно отключить.<br />Обратите внимание, что для просмотра чего-либо необходимо иметь авторизацию в ВК на текущем браузере и состоять в группе ВК.</p>
        <p>Новая функция в окне «Настройки»<br />Для функции плеера добавлена возможность его отключения, в этом случае будут использоваться ссылки (как раньше) и открывать новую страницу. По-умолчанию плеер используется.</p>
        <h1>Что нового от 02.07.26</h1>
        <p>Новая функция в окне «Настройки»<br />Для сайта добавлена функция выбора домена ВК, который будет использоваться для соответствующих ссылок.<br />Всего домена два – "Старый (vk.com)" и "Новый (vkvideo.ru)", по-умолчанию используется вариант "Новый".</p>
        <h1>Что нового от 28.06.26</h1>
        <p>Новая функция в разделе «Тайтлы»<br />На страницу с тайтлами добавлена функция быстрой навигации между секциями (буквы). Для удобства текущая секция, в которой находится пользователь, дополнительно подсвечивается.</p>
        <h1>Что нового от 09.06.26</h1>
        <p>Новая функция в разделе «Заказы»<br />Теперь просмотренные слоты не удаляются из заказа, а становятся полупрозрачными для наглядности. Полностью просмотренные заказы переносятся в соответствующий раздел.<br />Если заказ имеет сезоны, то каждый сезон считается отдельным заказом.<br />Также если какой-либо заказ был просмотрен без наличия активных слотов, то просмотренные условно в долг слоты будут добавляться к заказам для наглядности.</p>
        <h1>Что нового от 01.06.26</h1>
        <p>Обновление структуры сайта<br />Сайт перешел на одностраничный формат для каждой основной категории. Всего страницы три – Главная, Тайтлы и Заказы. Каждая страница разделена на разделы – вкладки, между которыми можно переключаться.</p>
        <p>Раздел «Главная»<br />Содержит в себе титульный экран, расписание и вкладки с полезной информацией, например, правила заказа контента, а также окно с настройками сайта.</p>
        <p>Раздел «Тайтлы»<br />Содержит в себе карточки тайтлов, разделённые на подгруппы, и окно рандомайзера.</p>
        <p>Раздел «Заказы»<br />Содержит в себе списки заказов, которые разделены на разделы (вкладки).</p>
        <p>Навигация и управление<br />Теперь чтобы попасть в раздел (вкладка), например, с фильмами или играми, достаточно переключить вкладку, а переход из одного основного раздела в другой осуществляется по соответственной кнопке под вкладками в нижней части экрана.<br />Строка поиска, индикатор стрима и кнопка избранного теперь находятся в верхней части экрана.</p>
        <p>Поиск вышел из бета-версии<br />Теперь окно поиска выдаёт не просто ссылки на искомые тайтлы, а сразу показывает полноценные карточки. Система поиска также разделена для страниц «Тайтлы» и «Заказы», и искать можно как карточки тайтлов так и карточки заказов.</p>
        <p>Улучшения системы избранного<br />Теперь система избранного работает индивидуально для страниц «Тайтлы» и «Заказы», отслеживать можно как карточку тайтла так и карточку заказа.</p>
        <p>Улучшения системы рандомайзера<br />Теперь рандомайзер находится в отдельном окне и имеет небольшую историю случайно выдаваемых тайтлов.</p>
        <p>Персональные настройки<br />Сайт получил возможность выбрать оформление – тёмную или светлую темы, тёмная тема задумывалась основной.<br />Для карточек тайтлов можно настроить свой размер, и сделать их либо крупнее, либо мельче (В мобильной версии карточка не имеет настройки размера и занимает всю ширину экрана по-умолчанию).</p>
